title = "DevCarnival"
baseURL = "https://devcarnival.github.io/"
languageCode = "en-us"
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

[params]
  description = "DevCarnival is a two-day global developer tech festival in Chennai (Jan 8–9, 2027) uniting industry, developers, students, and academia for tech talks, workshops, and hands-on Tech Pavilion."
  keywords = [
    "DevCarnival",
    "Dev Carnival",
    "DevCarnival Chennai",
    "Chennai Tech Conference",
    "Tech Festival Chennai",
    "Infosys Mahindra City",
    "Developer Conference India",
    "AI Conference Chennai",
    "Cloud Native Chennai",
    "Tech Pavilion",
    "Software Engineering Festival"
  ]
  github = "https://github.com/devcarnival"
  linkedin = "https://www.linkedin.com/company/dev-carnival"
  email = "contact@devcarnival.com"

[params.konfhub]
  enabled = true
  event_url = "https://konfhub.com/dev-carnival"
  checkout_url = "https://konfhub.com/checkout/dev-carnival"
  widget_url = "https://konfhub.com/widget/id/c4d4ff60-ab04-42af-aaf8-fba02b893bd6"
  status_note = "Official Passes Hosted on KonfHub"

[menu]
  [[menu.main]]
    name = "Speakers"
    url = "/speakers"
    weight = 1
  [[menu.main]]
    name = "Schedule"
    url = "/schedule"
    weight = 2
  [[menu.main]]
    name = "Tech Pavilion"
    url = "/projects"
    weight = 3
  [[menu.main]]
    name = "Community"
    url = "/communities"
    weight = 4

[taxonomies]
  year = "years"
  tag = "tags"
  category = "categories"
  business_domain = "business_domains"
  tech_domain     = "tech_domains"

[permalinks]
  session = "/session/:slug/"
  communities = "/communities/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  allowContent = [".*"]

