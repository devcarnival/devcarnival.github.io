title = "DevCarnival"
baseURL = "https://example.com/"
languageCode = "en-us"

[params]
  description = "Inspired by the spirit of a true carnival, DevCarnival is a two-day global tech festival in Chennai uniting industry, developers, and academia for purpose-oriented engineering."
  github = "https://github.com/devcarnival"
  linkedin = "https://www.linkedin.com/company/dev-carnival"
  email = "contact@devcarnival.com"

[params.konfhub]
  enabled = true
  event_url = "https://konfhub.com/dev-carnival"
  checkout_url = "https://konfhub.com/checkout/dev-carnival"
  widget_url = "https://konfhub.com/widget/id/c4d4ff60-ab04-42af-aaf8-fba02b893bd6"
  status_note = "Official Passes Hosted on KonfHub"

[menu]
  [[menu.main]]
    name = "Sessions"
    url = "/session"
    weight = 1
  [[menu.main]]
    name = "Speakers"
    url = "/speakers"
    weight = 2
  [[menu.main]]
    name = "Schedule"
    url = "/schedule"
    weight = 3
  [[menu.main]]
    name = "Tech Pavilion"
    url = "/projects"
    weight = 4
  [[menu.main]]
    name = "Community"
    url = "/communities"
    weight = 5

[taxonomies]
  year = "years"
  tag = "tags"
  category = "categories"
  business_domain = "business_domains"
  tech_domain     = "tech_domains"

[permalinks]
  session = "/session/:slug/"
  communities = "/communities/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  allowContent = [".*"]

